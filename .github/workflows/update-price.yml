name: Update Petrolimex Prices

on:
  schedule:
    - cron: '0 8 * * *'          # Mỗi ngày lúc 8h sáng (UTC) → ~15h VN
  workflow_dispatch:             # Cho phép chạy thủ công

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'       # Hoặc 22, miễn >=18 để fetch native

      - name: Install dependencies
        run: npm install cheerio

      - name: Run scraper
        run: node index.js   # tên file code của bạn

      - name: Commit & push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Update prices $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # tự động có sẵn